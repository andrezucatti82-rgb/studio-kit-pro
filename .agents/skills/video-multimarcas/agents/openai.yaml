interface:
  display_name: "Vídeo Multimarcas"
  short_description: "Uso geral: vídeos adaptados à marca, logo ou site informado"
  default_prompt: "Use $video-multimarcas. Pesquise o tema e adapte roteiro, identidade e vídeo à marca informada, com ação por plano, profundidade coerente, ritmo pela locução e transições motivadas. Teste a parte mais exigente e revise playback e escuta antes de aprovar o acabamento. Não reutilize marca ou voz de outro projeto. Recupere os critérios completos e quadros dos estilos, atribuindo papéis a até dez escolhas. Gere moodboard e storyboard visuais, com aprovações separadas antes da amostra. Confira anexos e capacidades, faça até três perguntas pertinentes ou opções numeradas e atualize a ficha portátil; declarações não comprovam recebimento ou aprovação. Para pedidos do site em Codex ou Claude Code, leia references/orchestrator-execution.md, importe a ficha completa e use o próprio modelo da conversa para executar o runtime até o MP4, com aviso de custo antes de gerar e sem substituir o estilo pela prova técnica."
