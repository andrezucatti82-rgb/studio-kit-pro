interface:
  display_name: "Studio Kit Pro · Vídeo Multimarcas"
  short_description: "Orquestra sete especialidades para produzir o vídeo escolhido"
  default_prompt: "Use $video-multimarcas. Leia references/skill-routing.md; selecione módulos pelas características e escopos efetivos. Preserve a escolha, arquivos e decisões. Planeje fala, atuação e motion juntos quando pertinente. Confira capacidades e próximas faltas reais. Execute o runtime compatível até o MP4 quando recursos e autorizações existirem; em chat sem execução informe a dependência. Não conceda aceites nem infira revisão, custos ou publicação."
